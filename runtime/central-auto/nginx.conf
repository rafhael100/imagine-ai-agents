server {
 listen 8443 ssl;
 ssl_certificate /certs/agents.crt;
 ssl_certificate_key /certs/agents.key;
 ssl_client_certificate /certs/ca.crt;
 ssl_verify_client on;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 access_log off;
 client_max_body_size 8k;
 client_body_timeout 3s;
 location = /private/events {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME /var/www/html/runtime/central-auto/index.php;
  fastcgi_param IMAGINE_MTLS_VERIFY $ssl_client_verify;
  fastcgi_param IMAGINE_MTLS_CERT $ssl_client_escaped_cert;
  fastcgi_pass agents-app:9000;
 }
 location = /private/events/receipt {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME /var/www/html/runtime/central-auto/event-status.php;
  fastcgi_param IMAGINE_MTLS_VERIFY $ssl_client_verify;
  fastcgi_param IMAGINE_MTLS_CERT $ssl_client_escaped_cert;
  fastcgi_pass agents-app:9000;
 }
 location / { return 404; }
}
