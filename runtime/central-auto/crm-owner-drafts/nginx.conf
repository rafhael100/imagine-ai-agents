server {
 listen 8443 ssl;
 ssl_certificate /certs/agents.crt;
 ssl_certificate_key /certs/agents.key;
 ssl_client_certificate /certs/ca.crt;
 ssl_verify_client on;
 ssl_protocols TLSv1.2 TLSv1.3;
 server_tokens off;
 access_log off;
 client_max_body_size 8k;
 client_body_timeout 3s;
 location = /private/owner-drafts/create {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME /var/www/html/runtime/central-auto/crm-owner-drafts/create.php;
  fastcgi_param IMAGINE_MTLS_VERIFY $ssl_client_verify;
  fastcgi_param IMAGINE_MTLS_CERT $ssl_client_escaped_cert;
  fastcgi_read_timeout 6s;
  fastcgi_pass agents-create:9000;
 }
 location = /private/owner-drafts/read {
  include fastcgi_params;
  fastcgi_param SCRIPT_FILENAME /var/www/html/runtime/central-auto/crm-owner-drafts/read.php;
  fastcgi_param IMAGINE_MTLS_VERIFY $ssl_client_verify;
  fastcgi_param IMAGINE_MTLS_CERT $ssl_client_escaped_cert;
  fastcgi_read_timeout 6s;
  fastcgi_pass agents-read:9001;
 }
 location / { return 404; }
}
