name: Central automation credential revocation lock
on:
  pull_request:
    paths: ['tools/auto_ia/**', '.github/workflows/central-auto-credential-lock.yml']
permissions:
  contents: read
jobs:
  postgres-credential-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: synthetic-ci-only
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      PGHOST: 127.0.0.1
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: synthetic-ci-only
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
      - name: Existing disposable inbox and signed regressions
        run: |
          psql -v ON_ERROR_STOP=1 -f tools/auto_ia/pg/001_auto_ia_pg_lab.sql
          psql -v ON_ERROR_STOP=1 -f tools/auto_ia/pg/002_no_ai_inbox.sql
          psql -v ON_ERROR_STOP=1 -f tools/auto_ia/pg/003_signed_ingress_lab.sql
          php tools/auto_ia/pg/check_auto_ia_10.php > /tmp/existing-signed-cases.sql
          psql -v ON_ERROR_STOP=1 -f /tmp/existing-signed-cases.sql
      - name: Two real PostgreSQL sessions order admission and revocation
        run: bash tools/auto_ia/pg/check_key_revocation_lock.sh
