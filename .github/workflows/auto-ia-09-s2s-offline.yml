name: AUTO-IA-09 signed S2S fixture verifier (offline)
on:
  push:
    branches:
      - feat/auto-ia-09-s2s-envelope-signatures-2026-11-16
  pull_request:
    branches:
      - feat/auto-ia-08-pg-inbox-no-ai-2026-11-16
permissions:
  contents: read
jobs:
  signed-envelope:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          persist-credentials: false
      - name: Validate signed offline event and negative mutations
        run: |
          php -l tools/auto_ia/MockS2SEnvelopeVerifier.php
          php -l tools/auto_ia/check_auto_ia_09.php
          php tools/auto_ia/check_auto_ia_09.php
          php tools/auto_ia/check_auto_ia.php
          php tools/auto_ia/check_auto_ia_02.php
          php tools/auto_ia/check_auto_ia_05.php
          python3 tools/auto_ia/check_auto_ia_06.py
