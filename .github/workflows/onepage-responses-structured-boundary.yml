name: AI Agents OnePage Responses structured candidate (offline, NO-GO)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - 'test/aia-onepage-copy-process-synthetic-2026-11-20-r01'
    paths:
      - 'src/Integration/OnepageResponsesStructuredBoundary.php'
      - 'tests/onepage-responses-structured-boundary-offline.php'
      - '.github/workflows/onepage-responses-structured-boundary.yml'
permissions:
  contents: read
concurrency:
  group: aia-onepage-responses-${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  structured-boundary:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/aia-onepage-responses-structured-boundary-2026-11-20-r02'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - name: Lint and run new candidate tests, no network/secrets
        run: |
          set -euo pipefail
          php -l src/Integration/OnepageResponsesStructuredBoundary.php
          php -l tests/onepage-responses-structured-boundary-offline.php
          php tests/onepage-responses-structured-boundary-offline.php | tee "$RUNNER_TEMP/onepage-responses.log"
          grep -Eq '^ONEPAGE RESPONSES STRUCTURED PASS: [0-9]+ offline assertions; RECORDED FIXTURE ONLY; NO API CALL; NO-GO[.]$' "$RUNNER_TEMP/onepage-responses.log"
      - name: Ensure candidate has no credential, HTTP client or raw request logging
        run: |
          set -euo pipefail
          ! grep -Eiq 'OPENAI_API_KEY|curl_exec|file_get_contents\(|https?://|proc_open\(|fwrite\(STD|echo.*\$taskJson|var_dump\(' src/Integration/OnepageResponsesStructuredBoundary.php
