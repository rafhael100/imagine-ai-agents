name: AIA P66 Imagine operator interface and complete combined regression
on:
  pull_request:
    branches:
      - test/aia-rc76-op01-combined-evidence-2026-11-17
permissions:
  contents: read
concurrency:
  group: aia-p66-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  imagine-interface-and-combined-regression:
    if: >-
      github.repository == 'rafhael100/imagine-ai-agents' &&
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      N8N_IMAGE: ghcr.io/n8n-io/n8n@sha256:b4b90747b81fcda7e76550c0d3aa7f0f64917a1e9573cff40d6834eaf2e0f8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-ai-agents
          ref: c08688b16e61d8d1ecc4d8c0ed4da8758a687ee8
          path: _central_p30_pinned
          fetch-depth: 0
          persist-credentials: false
      - name: Verify actual PR and reviewed source before preparing runtimes
        env:
          P24_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          php -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);'
          python3 --version
          node --version
          docker compose version
          bash -n tools/run_rc77_p66_virtual_tree.sh
          node --check tests/Browser/p66_imagine_lab.cjs
          git diff --check
          bash tools/run_rc77_p66_virtual_tree.sh --preflight
      - name: Prepare pinned runtimes and matching browser package
        run: |
          set -euo pipefail
          docker pull "$N8N_IMAGE" >/dev/null
          docker pull postgres:17 >/dev/null
          docker pull postgres:16 >/dev/null
          docker pull nginx:stable-alpine >/dev/null
          docker pull mcr.microsoft.com/playwright:v1.56.1-noble >/dev/null
          n8n_pg="$(docker image inspect postgres:17 --format '{{index .RepoDigests 0}}')"
          agents_pg="$(docker image inspect postgres:16 --format '{{index .RepoDigests 0}}')"
          agents_nginx="$(docker image inspect nginx:stable-alpine --format '{{index .RepoDigests 0}}')"
          p66_browser_image="$(docker image inspect mcr.microsoft.com/playwright:v1.56.1-noble --format '{{.Id}}')"
          test -n "$n8n_pg"
          test -n "$agents_pg"
          test -n "$agents_nginx"
          test -n "$p66_browser_image"
          docker build --quiet -f _central_p30_pinned/runtime/central-auto/Dockerfile -t "imagine-p66-php:$GITHUB_RUN_ID" _central_p30_pinned >/dev/null
          agents_php="$(docker image inspect "imagine-p66-php:$GITHUB_RUN_ID" --format '{{.Id}}')"
          test -n "$agents_php"
          npm install --prefix "$RUNNER_TEMP/aia-p66-playwright" --ignore-scripts --no-audit --no-fund playwright@1.56.1
          mkdir "$RUNNER_TEMP/aia-p66-evidence"
          echo "N8N_PG_IMAGE=$n8n_pg" >> "$GITHUB_ENV"
          echo "AGENTS_PG_IMAGE=$agents_pg" >> "$GITHUB_ENV"
          echo "AGENTS_PHP_IMAGE=$agents_php" >> "$GITHUB_ENV"
          echo "AGENTS_NGINX_IMAGE=$agents_nginx" >> "$GITHUB_ENV"
          echo "AIA_P66_PLAYWRIGHT_IMAGE=$p66_browser_image" >> "$GITHUB_ENV"
          echo "AIA_P66_PLAYWRIGHT_DIR=$RUNNER_TEMP/aia-p66-playwright" >> "$GITHUB_ENV"
          echo "AIA_P66_ARTIFACT_DIR=$RUNNER_TEMP/aia-p66-evidence" >> "$GITHUB_ENV"
      - name: Actual draft journey in Chromium and complete original regression matrix
        env:
          P24_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          P30_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          bash tools/run_rc77_p66_virtual_tree.sh
      - name: Make only screenshot evidence readable by the artifact runner
        if: always()
        run: |
          if test -d "$RUNNER_TEMP/aia-p66-evidence"; then
            sudo chown -R "$(id -u):$(id -g)" "$RUNNER_TEMP/aia-p66-evidence"
          fi
      - name: Preserve credential-free before and after screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: aia-p66-imagine-before-after
          path: ${{ runner.temp }}/aia-p66-evidence/*.png
          retention-days: 7
          if-no-files-found: ignore
