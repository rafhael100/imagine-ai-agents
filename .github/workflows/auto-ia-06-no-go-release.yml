name: AUTO-IA-06 release NO-GO and provider bypass audit (offline)

on:
  push:
    branches:
      - feat/auto-ia-06-no-go-release-audit-2026-11-16
  pull_request:
    branches:
      - feat/auto-ia-05-n8n-private-event-contract-2026-11-16

permissions:
  contents: read

jobs:
  fail-closed-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pinned v7.0.1
        with:
          persist-credentials: false
      - name: Verify offline AUTO-IA-01 through AUTO-IA-05
        run: |
          php tools/auto_ia/check_auto_ia.php
          php tools/auto_ia/check_auto_ia_02.php
          php tools/auto_ia/check_auto_ia_05.php
          python3 tools/auto_ia/check_auto_ia_03.py
          python3 tools/auto_ia/check_auto_ia_04.py
      - name: Assert NO-GO for all real integrations
        run: |
          python3 -m py_compile tools/auto_ia/release_readiness_lab.py tools/auto_ia/check_auto_ia_06.py
          python3 tools/auto_ia/check_auto_ia_06.py
          python3 tools/auto_ia/release_readiness_lab.py
