name: Agents P9 - fenced outbox acknowledgements and credit regression

on:
  push:
    branches:
      - dev/aia-p9-fenced-n8n-ack-2026-11-16
  pull_request:
    branches:
      - dev/aia-p8-pg-credit-reservation-2026-11-16

permissions:
  contents: read

jobs:
  p9-fencing:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: imagine_agents_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_agents_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AIA_P4_PG_LAB: 'true'
      AIA_P6_PG_LAB: 'true'
      AIA_P8_PG_LAB: 'true'
      DB_HOST: 127.0.0.1
      DB_DATABASE: imagine_agents_ci
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-password
    steps:
      - name: Read-only reviewed checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: PHP 8.4 and PG16
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none
      - name: Verify disposable DB and lint
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rafhael100/imagine-ai-agents"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "imagine_agents_ci"
          php -l tools/labs/PgN8nOutboxLab.php
          php -l tools/check_p6_n8n_outbox.php
          php -l tools/labs/PgAiCreditReservationLab.php
          php -l tools/check_p8_credit_reservation.php
      - name: Run outbox lease-fencing and replay tests on real PG16
        shell: bash
        run: |
          set -euo pipefail
          php tools/check_p6_n8n_outbox.php
      - name: Verify credit holds and automation-first regression
        shell: bash
        run: |
          set -euo pipefail
          php tools/check_p5_ai_routing.php
          php tools/check_p8_credit_reservation.php
          php tools/check_p4_pg_workbench.php
          echo 'P9_FENCED_ACK_PG16_PASS stale_lease=denied same_worker_reuse=denied credits_idempotent=true real_n8n=false operational_decision=NO_GO' >> "$GITHUB_STEP_SUMMARY"
