# FT01-F1-01: validacao isolada, condicionada a franquia de Actions.
# ATENCAO: nao aplicar o rotulo sem confirmar uso incluido disponivel
# e bloqueio de despesas adicionais nas configuracoes da conta GitHub.
# Nao instala dependencias, nao integra CRM, nao executa deploy.
name: FT01 F1-01 - PHP lint e testes sinteticos (rotulo manual)

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: ft01-f1-01-php-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  php-mock-validation:
    name: Lint PHP e 10 testes locais
    if: >-
      github.event.label.name == 'ft01-php-ci-free-quota-verified' &&
      github.event.pull_request.number == 71 &&
      github.event.pull_request.head.repo.full_name == 'rafhael100/imagine-ai-agents' &&
      github.event.pull_request.head.ref == 'dev/ft01-f1-01-domain-mocks-2026-11-06' &&
      github.event.pull_request.base.ref == 'dev/ft01-aia-core-mocks-2026-11-06'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Checkout somente leitura do PR
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verificar PHP preinstalado >= 8.1 (sem instalacao)
        shell: bash
        run: |
          set -euo pipefail
          command -v php
          php -v
          php -r 'if (PHP_VERSION_ID < 80100) { fwrite(STDERR, "PHP 8.1+ necessario\n"); exit(1); }'

      - name: Lint dos arquivos PHP sem dependencias
        shell: bash
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find src/ tests/Unit/ -type f -name '*.php' -print0)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            php -l "$file"
          done

      - name: Executar os 10 testes unitarios sinteticos
        shell: bash
        run: |
          set -euo pipefail
          php tests/Unit/run.php
