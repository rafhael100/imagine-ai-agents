name: F1-18 synthetic edge-telemetry regression

on:
  push:
    branches:
      - dev/ft01-f1-18-safe-edge-telemetry-2026-11-09

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact reviewed commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate all synthetic PHP checks offline
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PHP: '73'
          EXPECTED_CASES: '228'
        run: |
          php -v
          bash tools/validate_ft01_offline.sh
