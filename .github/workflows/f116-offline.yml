name: F1-16 synthetic CRM owner-policy regression

on:
  push:
    branches:
      - dev/ft01-f1-16-owner-policy-recheck-2026-11-09

permissions:
  contents: read

jobs:
  verify:
    # Protect against consumption of private-repository GitHub Actions minutes.
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact reviewed SHA, no stored credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run strictly offline PHP regression
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PHP: '68'
          EXPECTED_CASES: '198'
        run: |
          php -v
          bash tools/validate_ft01_offline.sh
