name: AIA RC76 P65 minimal projection and full combined regression
on:
  pull_request:
    branches:
      - feat/aia-p65-crm-minimal-read-consumer-2026-11-17
permissions:
  contents: read
concurrency:
  group: aia-rc76-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  op01-combined-evidence:
    if: >-
      github.repository == 'rafhael100/imagine-ai-agents' &&
      github.event.repository.private == false &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      N8N_IMAGE: ghcr.io/n8n-io/n8n@sha256:b4b90747b81fcda7e76550c0d3aa7f0f64917a1e9573cff40d6834eaf2e0f8ea
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-ai-agents
          ref: c08688b16e61d8d1ecc4d8c0ed4da8758a687ee8
          path: _central_p30_pinned
          fetch-depth: 0
          persist-credentials: false
      - name: Verify real PR provenance and unchanged candidate before images
        env:
          P24_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          python3 --version
          php -r 'exit(PHP_VERSION_ID >= 80300 ? 0 : 1);'
          php --version
          docker compose version
          openssl version
          bash -n tools/run_rc76_p65_virtual_tree.sh
          git diff --check
          bash tools/run_rc76_p65_virtual_tree.sh --preflight
      - name: Prepare images before the isolated recovery
        run: |
          set -euo pipefail
          docker pull "$N8N_IMAGE" >/dev/null
          docker pull postgres:17 >/dev/null
          docker pull postgres:16 >/dev/null
          docker pull nginx:stable-alpine >/dev/null
          n8n_pg="$(docker image inspect postgres:17 --format '{{index .RepoDigests 0}}')"
          agents_pg="$(docker image inspect postgres:16 --format '{{index .RepoDigests 0}}')"
          test -n "$n8n_pg"
          test -n "$agents_pg"
          agents_nginx="$(docker image inspect nginx:stable-alpine --format '{{index .RepoDigests 0}}')"
          test -n "$agents_nginx"
          docker build --quiet -f _central_p30_pinned/runtime/central-auto/Dockerfile -t "imagine-rc76-php:$GITHUB_RUN_ID" _central_p30_pinned >/dev/null
          agents_php="$(docker image inspect "imagine-rc76-php:$GITHUB_RUN_ID" --format '{{.Id}}')"
          test -n "$agents_php"
          echo "N8N_PG_IMAGE=$n8n_pg" >> "$GITHUB_ENV"
          echo "AGENTS_PG_IMAGE=$agents_pg" >> "$GITHUB_ENV"
          echo "AGENTS_PHP_IMAGE=$agents_php" >> "$GITHUB_ENV"
          echo "AGENTS_NGINX_IMAGE=$agents_nginx" >> "$GITHUB_ENV"
      - name: Run original P65 consumer with the complete RC75 regression matrix
        env:
          P24_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          P30_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          bash tools/run_rc76_p65_virtual_tree.sh
