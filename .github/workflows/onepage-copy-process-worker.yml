name: AI Agents OnePage one-shot worker (synthetic process, NO-GO)
on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
    paths:
      - 'src/Integration/OnepageCopyProcessWorker.php'
      - 'tools/onepage_copy_process_worker.php'
      - 'tests/onepage-copy-process-worker-offline.php'
      - '.github/workflows/onepage-copy-process-worker.yml'
permissions:
  contents: read
concurrency:
  group: aia-onepage-process-\${{ github.event.pull_request.number }}
  cancel-in-progress: false
jobs:
  bounded-worker:
    if: >-
      github.event.pull_request.draft == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'test/aia-onepage-copy-process-synthetic-2026-11-20-r01'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4']
    env:
      IMAGINE_ONEPAGE_PROCESS_LAB: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: \${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: \${{ matrix.php }}
          extensions: mbstring
          coverage: none
      - name: Validate bounded process and schema
        run: |
          set -euo pipefail
          php -l src/Integration/OnepageCopyProcessWorker.php
          php -l tools/onepage_copy_process_worker.php
          php -l tests/onepage-copy-process-worker-offline.php
          php tests/onepage-copy-process-worker-offline.php | tee "$RUNNER_TEMP/onepage.log"
          grep -Eq '^ONEPAGE PROCESS WORKER PASS: [0-9]+ synthetic checks; NO-GO; NO OPENAI REQUEST[.]$' "$RUNNER_TEMP/onepage.log"
      - name: No providers or secrets in this worker
        run: |
          set -euo pipefail
          ! grep -Eq 'OPENAI_API_KEY|api[.]openai[.]com|curl_exec|Asaas|Cloudflare|https?://' src/Integration/OnepageCopyProcessWorker.php tools/onepage_copy_process_worker.php
