name: F1-15 synthetic contract conformance

on:
  push:
    branches:
      - dev/ft01-f1-15-contract-conformance-2026-11-09

permissions:
  contents: read

jobs:
  verify:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout SHA under review
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Run strict offline PHP suite
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PHP: '66'
          EXPECTED_CASES: '180'
        run: |
          php -v
          bash tools/validate_ft01_offline.sh
