name: CENTRAL AUTO P4 private n8n Compose candidate
on:
  pull_request:
    paths: ['infra/n8n-private/**', '.github/workflows/central-auto-p4-private-compose.yml']
permissions:
  contents: read
jobs:
  private-compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      COMPOSE_PROJECT_NAME: imagine-n8n-p4-ci
      N8N_EXPECTED_PROJECT: imagine-n8n-p4-ci
      N8N_IMAGE: ghcr.io/n8n-io/n8n@sha256:b4b90747b81fcda7e76550c0d3aa7f0f64917a1e9573cff40d6834eaf2e0f8ea
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Inventory parser and upstream immutable official n8n proof
        run: |
          python3 infra/n8n-private/test_readonly_inventory.py
          python3 tools/auto_ia/check_rc04_integrity.py
      - name: Prepare runner-only secret files and reviewed image reference
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/n8n-p4-secrets"
          python3 - <<'PY'
          import os,secrets,pathlib
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'n8n-p4-secrets'
          for name in ['admin','runtime','encryption']:
            p=root/name;p.write_text(secrets.token_hex(32));p.chmod(0o444)
          PY
          echo "N8N_PG_ADMIN_PASSWORD_FILE=$RUNNER_TEMP/n8n-p4-secrets/admin" >> "$GITHUB_ENV"
          echo "N8N_PG_PASSWORD_FILE=$RUNNER_TEMP/n8n-p4-secrets/runtime" >> "$GITHUB_ENV"
          echo "N8N_ENCRYPTION_KEY_FILE=$RUNNER_TEMP/n8n-p4-secrets/encryption" >> "$GITHUB_ENV"
          docker pull postgres:16 >/dev/null
          docker pull "$N8N_IMAGE" >/dev/null
          echo "N8N_PG_IMAGE=$(docker image inspect postgres:16 --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - name: Expand candidate safely and start only ephemeral isolated services
        run: |
          docker compose --profile homologation -f infra/n8n-private/docker-compose.yml config --format json | python3 infra/n8n-private/check_compose_static.py
          docker compose --profile homologation -f infra/n8n-private/docker-compose.yml up -d --wait --wait-timeout 180
      - name: Verify actual database runtime privileges, readiness, isolation and secrets
        run: |
          set -euo pipefail
          dc=(docker compose --profile homologation -f infra/n8n-private/docker-compose.yml)
          test "$("${dc[@]}" exec -T n8n-db psql -X -qAt -U n8n_bootstrap_admin -d n8n -c "SELECT rolsuper OR rolbypassrls OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname='n8n_runtime'")" = f
          test "$("${dc[@]}" exec -T n8n-db psql -X -qAt -U n8n_bootstrap_admin -d n8n -c "SELECT count(*)>0 FROM pg_stat_activity WHERE usename='n8n_runtime' AND datname='n8n'")" = t
          curl --fail --silent --max-time 5 http://127.0.0.1:17990/healthz/readiness > /dev/null
          python3 - <<'PY'
          import subprocess,json
          command=['docker','compose','--profile','homologation','-f','infra/n8n-private/docker-compose.yml']
          ids=subprocess.check_output(command+['ps','-q'],text=True).split()
          assert len(ids)==2
          for ident in ids:
            data=json.loads(subprocess.check_output(['docker','inspect',ident]))[0]
            assert not data['HostConfig']['Privileged']
            assert not any(v.startswith(('POSTGRES_PASSWORD=','DB_POSTGRESDB_PASSWORD=','N8N_ENCRYPTION_KEY=')) for v in data['Config']['Env'])
            for network in data['NetworkSettings']['Networks']:
              item=json.loads(subprocess.check_output(['docker','network','inspect',network]))[0]
              assert item['Internal'] is True
          print('P4_PRIVATE_COMPOSE_PASS runtime_non_superuser=1 secret_values_in_container_env=0 private_networks=1 operational_release=0')
          PY
      - name: Remove only this job's ephemeral stack
        if: always()
        run: docker compose --profile homologation -f infra/n8n-private/docker-compose.yml down --volumes --remove-orphans
