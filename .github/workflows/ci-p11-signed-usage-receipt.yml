name: Agents P11 - signed usage receipts before credit reconciliation

on:
  push:
    branches:
      - dev/aia-p11-signed-usage-receipts-2026-11-16
  pull_request:
    branches:
      - dev/aia-p10-credit-dispatch-gate-2026-11-16

permissions:
  contents: read

jobs:
  signed-provider-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: imagine_agents_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_agents_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AIA_P4_PG_LAB: 'true'
      AIA_P6_PG_LAB: 'true'
      AIA_P8_PG_LAB: 'true'
      AIA_P11_SIGNED_PROOFS: 'true'
      DB_HOST: 127.0.0.1
      DB_DATABASE: imagine_agents_ci
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-password
    steps:
      - name: Checkout candidate without persistent credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: PHP 8.4 with libsodium and PG16
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, sodium, pdo_pgsql, pgsql
          coverage: none
      - name: Assert test-only environment and syntax
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rafhael100/imagine-ai-agents"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "imagine_agents_ci"
          php -l tools/labs/SyntheticUsageReceipt.php
          php -l tools/labs/PgAiCreditReservationLab.php
          php -l tools/check_p8_credit_reservation.php
          php -r 'if (!function_exists("sodium_crypto_sign_verify_detached")) exit(1);'
      - name: Run signed provider-fixture and financial consistency proofs
        shell: bash
        run: |
          set -euo pipefail
          php tools/check_p5_ai_routing.php
          php tools/check_p8_credit_reservation.php
      - name: Regress P9 ACK and P4 quota physical concurrency
        shell: bash
        run: |
          set -euo pipefail
          php tools/check_p6_n8n_outbox.php
          php tools/check_p4_pg_workbench.php
          echo 'P11_SIGNED_USAGE_RECEIPT_CI_PASS ed25519_trust_pinned=true forged_proof_denied=true unsigned_charge_denied=true operational_decision=NO_GO provider_calls=0' >> "$GITHUB_STEP_SUMMARY"
