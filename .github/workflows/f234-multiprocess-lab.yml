name: F234 multi-process local replay lab (NO-GO)

on:
  push:
    branches:
      - dev/f234-multiprocess-file-replay-lab-2026-11-15
  pull_request:
    branches:
      - dev/f233-shared-nonce-contract-offline-2026-11-15

permissions:
  contents: read

jobs:
  local-concurrency:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout no credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Execute no-network PHP/Python concurrency test
        shell: bash
        run: |
          set -euo pipefail
          php -l src/MockBridge/MockFileAtomicNonceLab.php
          php -l tools/f234_nonce_worker.php
          python3 tools/check_f234_multiprocess.py
          echo 'F234_LOCAL_HOST_ONLY NO_GO_FOR_DISTRIBUTED_STORAGE' >> "$GITHUB_STEP_SUMMARY"
