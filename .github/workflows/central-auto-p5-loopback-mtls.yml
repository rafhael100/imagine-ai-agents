name: CENTRAL-AUTO-P5 real local mTLS between synthetic CRM and original Portal reader
on:
  push:
    branches:
      - feat/central-auto-p5-loopback-mtls-2026-11-16
permissions:
  contents: read
jobs:
  private-loopback-mtls:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-crm
          ref: 9afa6683e6b3463f12bd80a25f455f925828c0af
          path: _crm_contract_pin
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-portal
          ref: 9d3877dfaa81524faf2c08f80244b485968316ec
          path: _portal_contract_pin
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: openssl
          coverage: none
      - name: Validate immutable CRM and Portal sources
        run: |
          test "$(git -C _crm_contract_pin rev-parse HEAD)" = "9afa6683e6b3463f12bd80a25f455f925828c0af"
          test "$(git -C _portal_contract_pin rev-parse HEAD)" = "9d3877dfaa81524faf2c08f80244b485968316ec"
          php -l tools/auto_ia/central_transport/generate_crm_snapshot.php
          php -l tools/auto_ia/central_transport/check_portal_crm_mtls.php
          python3 -m py_compile tools/auto_ia/central_transport/mtls_crm_lab_server.py
          bash -n tools/auto_ia/central_transport/run_loopback_mtls.sh
      - name: Generate ephemeral CA and execute separate processes over real mTLS on 127.0.0.1
        run: |
          bash tools/auto_ia/central_transport/run_loopback_mtls.sh
      - name: Maintain NO_GO policies and no paid model usage
        run: |
          python3 tools/auto_ia/check_rc04_integrity.py
          python3 tools/auto_ia/convergence/check_rc03_release.py
          echo "CENTRAL_AUTO_P5_NO_GO no_production_endpoint=1 no_deploy=1 ai_calls=0"
