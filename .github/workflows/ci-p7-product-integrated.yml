name: Agents P7 - cumulative P4 P5 P6 candidate acceptance

on:
  push:
    branches:
      - review/aia-p4-p7-core-integrated-2026-11-16
  pull_request:
    branches:
      - dev/aia-p3-isolated-demo-serving-2026-11-16

permissions:
  contents: read

jobs:
  integrated-product-lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: imagine_agents_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d imagine_agents_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AIA_P4_PG_LAB: 'true'
      AIA_P6_PG_LAB: 'true'
      DB_HOST: 127.0.0.1
      DB_DATABASE: imagine_agents_ci
      DB_USERNAME: postgres
      DB_PASSWORD: ci-only-password
    steps:
      - name: Checkout reviewed source without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: PHP 8.4 with PDO PostgreSQL and mbstring
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_pgsql, pgsql
          coverage: none
      - name: Protect exact disposable PG16 environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "rafhael100/imagine-ai-agents"
          test "$DB_HOST" = "127.0.0.1"
          test "$DB_DATABASE" = "imagine_agents_ci"
          php -l tools/labs/PgSalesWorkbenchLab.php
          php -l tools/labs/PgN8nOutboxLab.php
          php -l src/MockOrchestration/MockAiOrAutomationRouter.php
          php -l src/MockOrchestration/MockN8nOutboxContract.php
      - name: Run P4 durable quota and approval race with 12 PHP processes
        shell: bash
        run: |
          set -euo pipefail
          php tools/check_p4_pg_workbench.php
      - name: Run P5 automation-first zero-credit model preflight
        shell: bash
        run: |
          set -euo pipefail
          php tools/check_p5_ai_routing.php
      - name: Run P6 canonical event outbox and lease/ACK PG16 proof
        shell: bash
        run: |
          set -euo pipefail
          php tools/check_p6_n8n_outbox.php
      - name: Verify commercial demo and PHP/JavaScript consistency
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_p0_sales_demo.py
          node tools/check_p1_sales_workbench.js
          php tools/check_p2_sales_domain.php
          node tools/check_p2_sales_parity.js
          echo 'P7_INTEGRATED_LAB_PASS pg16_quota=durable n8n_outbox=no_network ai_credits=0 real_customer_access=false operational_decision=NO_GO' >> "$GITHUB_STEP_SUMMARY"
