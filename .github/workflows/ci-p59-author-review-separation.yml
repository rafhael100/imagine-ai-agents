        shell: bash
        run: |
          set -euo pipefail
          psql -h 127.0.0.1 -U postgres -d imagine_agents_ci -v ON_ERROR_STOP=1             -f _central_auto_p7_pinned/tools/auto_ia/central_transport/001_pg_durable_nonce.sql
          psql -h 127.0.0.1 -U postgres -d imagine_agents_ci -At -v ON_ERROR_STOP=1             -c "SELECT to_regclass('central_auto_lab.mtls_nonce_ledger') IS NOT NULL"
      - name: P40 exercise original HTTPS/mTLS CRM/Portal processes and persistent nonce
        shell: bash
        run: |
          set -euo pipefail
          bash _central_auto_p7_pinned/tools/auto_ia/central_transport/run_loopback_mtls.sh
          bash _central_auto_p7_pinned/tools/auto_ia/central_transport/check_pg_nonce_race.sh
      - name: P41 verify approved company-to-tenant mapping from original P7 nonce ledger
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/labs/PgSyntheticCompanyTenantBridgeLab.php
          php -l tools/check_p41_company_tenant_bridge.php
