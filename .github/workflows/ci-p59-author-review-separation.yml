  p47-official-n8n-pg17-independent:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      COMPOSE_PROJECT_NAME: imagine-n8n-p4-ci
      N8N_EXPECTED_PROJECT: imagine-n8n-p4-ci
      N8N_IMAGE: ghcr.io/n8n-io/n8n@sha256:b4b90747b81fcda7e76550c0d3aa7f0f64917a1e9573cff40d6834eaf2e0f8ea
    steps:
      - name: Checkout candidate read-only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout RC07 source by immutable SHA, no merge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-ai-agents
          ref: cc55e568bc2994574b85b8b48969ac85fe2ec543
          path: _central_auto_rc07_pinned
          persist-credentials: false
      - name: Validate reviewed source and no-AI native workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C _central_auto_rc07_pinned rev-parse HEAD)" = "cc55e568bc2994574b85b8b48969ac85fe2ec543"
          python3 tools/check_p47_n8n_pg17_compat.py
          cd _central_auto_rc07_pinned
          python3 infra/n8n-private/test_native_noai_flow.py
          python3 infra/n8n-private/test_readonly_inventory.py
          python3 tools/auto_ia/check_rc04_integrity.py
      - name: Prepare transient secret files and pull reviewed container images
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/p47-n8n-secrets"
          python3 - <<'PY'
          import os,pathlib,secrets
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'p47-n8n-secrets'
          for name in ('admin','runtime','encryption'):
              f=root/name;f.write_text(secrets.token_hex(32));f.chmod(0o444)
          PY
          echo "N8N_PG_ADMIN_PASSWORD_FILE=$RUNNER_TEMP/p47-n8n-secrets/admin" >> "$GITHUB_ENV"
          echo "N8N_PG_PASSWORD_FILE=$RUNNER_TEMP/p47-n8n-secrets/runtime" >> "$GITHUB_ENV"
          echo "N8N_ENCRYPTION_KEY_FILE=$RUNNER_TEMP/p47-n8n-secrets/encryption" >> "$GITHUB_ENV"
          docker pull postgres:17 >/dev/null
          docker pull "$N8N_IMAGE" >/dev/null
          echo "N8N_PG_IMAGE=$(docker image inspect postgres:17 --format '{{index .RepoDigests 0}}')" >> "$GITHUB_ENV"
      - name: Run official n8n on internal-only PostgreSQL17 with no public UI
        shell: bash
        run: |
          set -euo pipefail
          cd _central_auto_rc07_pinned
          docker compose --profile homologation -f infra/n8n-private/docker-compose.yml config --format json | python3 infra/n8n-private/check_compose_static.py
          docker compose --profile homologation -f infra/n8n-private/docker-compose.yml up -d --wait --wait-timeout 180
          version=$(docker compose --profile homologation -f infra/n8n-private/docker-compose.yml exec -T n8n-db psql -X -qAt -U n8n_bootstrap_admin -d n8n -c 'SHOW server_version_num')
          test "$(printf '%s' "$version" | cut -c1-2)" = 17
          privileged=$(docker compose --profile homologation -f infra/n8n-private/docker-compose.yml exec -T n8n-db psql -X -qAt -U n8n_bootstrap_admin -d n8n -c "SELECT rolsuper OR rolbypassrls OR rolcreatedb OR rolcreaterole FROM pg_roles WHERE rolname='n8n_runtime'")
          test "$privileged" = f
          docker compose --profile homologation -f infra/n8n-private/docker-compose.yml exec -T n8n node -e "require('http').get('http://127.0.0.1:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
          if curl --fail --silent --max-time 2 http://127.0.0.1:17990/healthz/readiness > /dev/null; then
            echo 'P47_UNEXPECTED_HOST_UI_EXPOSURE' >&2
            exit 1
          fi
      - name: Reuse original RC07 import export and execute for native NO_AI funnel
        shell: bash
        run: |
          set -euo pipefail
          cd _central_auto_rc07_pinned
          bash infra/n8n-private/run_native_noai_pg.sh
          echo 'P47 independent n8n/PG17 native 120->12->2, AI=0. P46 lineage separate; no real S2S. NO_GO.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove only this runner's disposable n8n/PG17 containers
        if: always()
        shell: bash
        run: |
          if test -d _central_auto_rc07_pinned; then
            cd _central_auto_rc07_pinned
            docker compose --profile homologation -f infra/n8n-private/docker-compose.yml down --volumes --remove-orphans || true
          fi

