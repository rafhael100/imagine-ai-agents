          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AIA_P16_PG_LAB: 'true'
      AIA_P55_SCOPED_LAB: 'true'
      AIA_P56_BROWSER_LAB: 'true'
      DB_HOST: 127.0.0.1
      DB_DATABASE: imagine_agents_ci
    steps:
      - name: Checkout exact P56 lab candidate without retained credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Checkout fixed P15/P16 adapter, required by original P51 registry
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-ai-agents
          ref: 8b04d0e936168c77db028160b5aeb1758db497c4
          path: _auto_ia_pinned_source
          persist-credentials: false
      - name: Install PHP8.4 with PostgreSQL16 PDO and sodium
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: 'pdo_pgsql, mbstring, sodium'
          coverage: none
      - name: Seed only disposable synthetic tenants and SELECT-only role
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/bootstrap_p56_pg_browser_lab.php
          php -l examples/p56-live-pg-review-local.php
          php -l tools/labs/PgScopedReviewQueueBridgeLab.php
          echo "AIA_P56_READER_PASSWORD_FILE=$RUNNER_TEMP/aia_p56_ci_reader_password" >> "$GITHUB_ENV"
          php tools/bootstrap_p56_pg_browser_lab.php
      - name: Open localhost-only browser and test real row tampering fails closed
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/check_p56_live_pg_readonly_http.py
          echo 'P56 browser GETs only synthetic PostgreSQL16 rows under RLS read role. No approval, no business IAM, no provider calls. NO_GO.' >> "$GITHUB_STEP_SUMMARY"
      - name: Shred ephemeral fixture reader password file
        if: always()
        shell: bash
        run: |
          if test -f "$RUNNER_TEMP/aia_p56_ci_reader_password"; then
            chmod u+w "$RUNNER_TEMP/aia_p56_ci_reader_password" || true
            rm -f "$RUNNER_TEMP/aia_p56_ci_reader_password"
          fi
