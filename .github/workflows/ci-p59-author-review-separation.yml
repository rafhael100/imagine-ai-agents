      - name: P44 reject transport-only admission and verify signed owner decision in atomic stage
        shell: bash
        run: |
          set -euo pipefail
          php -l tools/labs/PgOwnerDecisionLab.php
          php -l tools/labs/PgAtomicCompanyTenantStageLab.php
