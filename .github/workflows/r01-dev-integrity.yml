name: R01 development integrity - offline and read-only

on:
  push:
    branches:
      - dev/ft01-aia-core-mocks-2026-11-06
      - dev/r01-evid-06-unified-dev-ci-2026-11-09
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'contracts/**'
      - 'docs/evidencias/**'
      - 'examples/**'
      - '.github/workflows/r01-dev-integrity.yml'
  pull_request:
    branches:
      - dev/ft01-aia-core-mocks-2026-11-06
    paths:
      - 'src/**'
      - 'tests/**'
      - 'tools/**'
      - 'contracts/**'
      - 'docs/evidencias/**'
      - 'examples/**'
      - '.github/workflows/r01-dev-integrity.yml'

permissions:
  contents: read

concurrency:
  group: r01-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    if: ${{ github.event.repository.private == false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read-only checkout of reviewed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24 SHA pinned
        with:
          persist-credentials: false
      - name: Confirm runtime is available without installing dependencies
        shell: bash
        run: |
          python3 --version
          php -v
          git rev-parse HEAD
      - name: Run reproducible offline quality gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PHP: '110'
          EXPECTED_CASES: '879'
        run: |
          bash tools/run_r01_offline_quality_gate.sh
      - name: Validar logomarca oficial Imagine e navegação do laboratório F108
        shell: bash
        run: |
          node --check tests/Browser/f108_imagine_brand.cjs
          node tests/Browser/f108_imagine_brand.cjs
      - name: Checkout pinned CRM public mock source for reciprocal OP-01 conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rafhael100/imagine-crm
          ref: 7999b1e34a6cbd0ee1c5e2351067ad172e01bbad
          path: _synthetic_crm_fixture
          persist-credentials: false
      - name: Verify exact CRM source SHA and execute reciprocal PHP denial contract
        shell: bash
        run: |
          test "$(git -C _synthetic_crm_fixture rev-parse HEAD)" = "7999b1e34a6cbd0ee1c5e2351067ad172e01bbad"
          php -l tools/check_crm_aia_cross_source.php
          php tools/check_crm_aia_cross_source.php
          set -euo pipefail
          php tools/check_crm_aia_scenario_matrix.php | python3 tools/verify_f209_matrix.py
          php -l tools/check_crm_aia_real_facade_core.php
          php tools/check_crm_aia_real_facade_core.php
