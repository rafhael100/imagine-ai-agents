name: R01 development integrity - offline and read-only

on:
  push:
    branches:
      - dev/ft01-aia-core-mocks-2026-11-06
      - dev/r01-evid-06-unified-dev-ci-2026-11-09
      - dev/f230-signed-crm-denial-response-2026-11-14
  pull_request:
    branches:
      - dev/ft01-aia-core-mocks-2026-11-06
      - main
      - dev/f229-tenant-hmac-replay-matrix-2026-11-14

permissions:
  contents: read

concurrency:
  group: r01-integrity-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Block main promotion while OP-01 has no independent release approval
        if: ${{ github.event_name == 'pull_request' && github.base_ref == 'main' }}
        shell: bash
        run: |
          echo "::error::OP01_MAIN_PROMOTION_NO_GO; 14 gates and 13 operational scenarios pending"
          exit 1
      - name: Fail closed when private cross-repository checkout is unreviewed
        if: ${{ github.event.repository.private == true }}
        shell: bash
        run: |
          echo "::error::PRIVATE_CROSS_REPOSITORY_SOURCE_NOT_VERIFIED; operational_decision=NO_GO"
          exit 1
      - name: Read-only checkout of reviewed SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 Node24 SHA pinned
        with:
          persist-credentials: false
      - name: Confirm runtime is available without installing dependencies
        shell: bash
        run: |
          python3 --version
          php -v
          git rev-parse HEAD
      - name: Run reproducible offline quality gate
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_PHP: '111'
          EXPECTED_CASES: '879'
        run: |
          bash tools/run_r01_offline_quality_gate.sh
      - name: Publish verified OP-01 NO-GO blockers to the GitHub job summary
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/plan_op01_release.py --check
          python3 tools/plan_op01_release.py --format markdown >> "$GITHUB_STEP_SUMMARY"
      - name: Validar logomarca oficial Imagine e navegação do laboratório F108
        shell: bash
        run: |
          node --check tests/Browser/f108_imagine_brand.cjs
          node tests/Browser/f108_imagine_brand.cjs
      - name: Checkout pinned CRM public mock source for reciprocal OP-01 conformance
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: rafhael100/imagine-crm
          ref: d7c7aacc766c7ade4c65dcd211ed4569442144a9
          path: _synthetic_crm_fixture
          persist-credentials: false
      - name: Verify exact CRM source SHA and execute reciprocal PHP denial contract
        shell: bash
        run: |
          test "$(git -C _synthetic_crm_fixture rev-parse HEAD)" = "d7c7aacc766c7ade4c65dcd211ed4569442144a9"
          php -l tools/check_crm_aia_cross_source.php
          php tools/check_crm_aia_cross_source.php
          set -euo pipefail
          php tools/check_crm_aia_scenario_matrix.php | python3 tools/verify_f209_matrix.py
          php -l tools/check_crm_aia_real_facade_core.php
          php tools/check_crm_aia_real_facade_core.php
          php -l tools/check_crm_aia_owner_failclosed.php
          php tools/check_crm_aia_owner_failclosed.php
          php -l tools/check_f226_signed_fixture.php
          php tools/check_f226_signed_fixture.php
          php -l _synthetic_crm_fixture/app/Support/Synthetic/AiaPgNonceCandidateLedger.php
          php -l _synthetic_crm_fixture/app/Support/Synthetic/AiaPgHmacLabBridge.php
          php -l tools/check_f229_tenant_replay_matrix.php
          php tools/check_f229_tenant_replay_matrix.php
          php -l tools/check_f230_signed_denial.php
          php tools/check_f230_signed_denial.php
          python3 tools/check_f224_reciprocal_pins.py
