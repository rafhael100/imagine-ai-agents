name: CENTRAL-AUTO P29 isolated ingress boundary probe
on:
  push:
    branches:
      - test/central-auto-p29-ingress-boundaries-2026-11-17
permissions:
  contents: read
concurrency:
  group: central-auto-p29-probe-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ingress-boundary-probe:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: rafhael100/imagine-ai-agents
          ref: 3fb86c5fb011bc9df1f12a4a30a7c094370b6872
          path: _agents_rc65_pinned
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare isolated PostgreSQL and private ingress images
        env:
          P24_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$P24_RUNNER_ENVIRONMENT" = github-hosted
          bash -n tools/run_p29_ingress_probe_virtual_tree.sh
          docker pull postgres:16 >/dev/null
          docker pull nginx:stable-alpine >/dev/null
          agents_pg="$(docker image inspect postgres:16 --format '{{index .RepoDigests 0}}')"
          agents_nginx="$(docker image inspect nginx:stable-alpine --format '{{index .RepoDigests 0}}')"
          docker build --quiet -f runtime/central-auto/Dockerfile -t "imagine-p29-probe:$GITHUB_RUN_ID" . >/dev/null
          agents_php="$(docker image inspect "imagine-p29-probe:$GITHUB_RUN_ID" --format '{{.Id}}')"
          test -n "$agents_pg" && test -n "$agents_nginx" && test -n "$agents_php"
          echo "AGENTS_PG_IMAGE=$agents_pg" >> "$GITHUB_ENV"
          echo "AGENTS_PHP_IMAGE=$agents_php" >> "$GITHUB_ENV"
          echo "AGENTS_NGINX_IMAGE=$agents_nginx" >> "$GITHUB_ENV"
      - name: Exercise signed malformed requests and real expiration races
        env:
          P24_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          set -euo pipefail
          bash tools/run_p29_ingress_probe_virtual_tree.sh
