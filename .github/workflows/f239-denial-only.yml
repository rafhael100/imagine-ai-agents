name: F239 uniform HTTP 404 denial contract (NO-GO)

on:
  push:
    branches:
      - dev/f239-uniform-denial-parser-2026-11-15
  pull_request:
    branches:
      - dev/f238-synthetic-http-envelope-2026-11-15

permissions:
  contents: read

jobs:
  denial-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - name: Reject unreviewed private source
        if: ${{ github.event.repository.private == true }}
        shell: bash
        run: |
          echo "PRIVATE_CROSS_REPOSITORY_SOURCE_NOT_VERIFIED"; exit 1
      - name: Checkout exact candidate without write credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Execute pure denial response validation
        shell: bash
        run: |
          set -euo pipefail
          php -l src/MockBridge/MockSyntheticHttpDenialReceipt.php
          php -l tools/check_f239_denial_receipt.php
          php tools/check_f239_denial_receipt.php
          php tools/check_synthetic_php_isolation.php
          echo 'F239_HTTP_404_ONLY operational_decision=NO_GO' >> "$GITHUB_STEP_SUMMARY"
