# CENTRAL-AUTO-P15: never remove mTLS / operator CN for the lab.
# Hardcoded synthetic CI identity, not usable as real operator IAM.
map $ssl_client_s_dn $operator_ci_allowed {
    default 0;
    "CN=imagine-operator-ci" 1;
}
# Bind authorization to the EXACT trusted client certificate, not just a CN.
map $ssl_client_fingerprint $operator_cert_allowed {
    default 0;
    include /etc/nginx/operator-fingerprints.conf;
}
server {
    listen 8443 ssl;
    server_name localhost;
    server_tokens off;
    ssl_certificate /run/secrets/operator_server_cert;
    ssl_certificate_key /run/secrets/operator_server_key;
    ssl_client_certificate /run/secrets/operator_client_ca;
    ssl_verify_client on;
    ssl_verify_depth 2;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    client_max_body_size 1m;
    if ($operator_ci_allowed = 0) { return 403; }
    if ($operator_cert_allowed = 0) { return 403; }
    location / {
        proxy_pass http://n8n:5678;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 30s;
        proxy_connect_timeout 3s;
    }
}
