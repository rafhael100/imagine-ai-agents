name: imagine-n8n-private-staging
# DRAFT ONLY — NEVER RUN WITHOUT HOST INVENTORY, SECURITY REVIEW AND SECRET STORAGE.
services:
  n8n-db:
    image: ${N8N_PG_IMAGE:?PIN_REVIEWED_POSTGRES_IMAGE_DIGEST}
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${N8N_PG_PASSWORD:?INJECT_SECRET_FROM_APPROVED_STORE}
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
    networks:
      - n8n_storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 3s
      retries: 8
    restart: "no"

  n8n:
    profiles: ["homologation"]
    image: ${N8N_IMAGE:?PIN_REVIEWED_N8N_IMAGE_DIGEST}
    init: true
    depends_on:
      n8n-db:
        condition: service_healthy
    ports:
      - "127.0.0.1:${N8N_LOOPBACK_PORT:-17990}:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_PG_PASSWORD:?INJECT_SECRET_FROM_APPROVED_STORE}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?INJECT_SECRET_FROM_APPROVED_STORE}
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n_storage
      - n8n_apps_private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    restart: "no"

volumes:
  n8n_pgdata: {}
  n8n_data: {}
networks:
  n8n_storage:
    internal: true
  n8n_apps_private:
    internal: true
