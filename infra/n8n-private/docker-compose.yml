name: imagine-n8n-private-staging
# DRAFT ONLY — NEVER RUN WITHOUT HOST INVENTORY, SECURITY REVIEW AND SECRET STORAGE.
services:
  n8n-db:
    profiles: ["homologation"]
    image: ${N8N_PG_IMAGE:?PIN_REVIEWED_POSTGRES_IMAGE_DIGEST}
    environment:
      POSTGRES_USER: n8n_bootstrap_admin
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD_FILE: /run/secrets/n8n_pg_admin_password
    volumes:
      - n8n_pgdata:/var/lib/postgresql/data
      - ./10-runtime-role.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    secrets:
      - n8n_pg_admin_password
      - n8n_pg_password
    networks:
      - n8n_storage
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n_bootstrap_admin -d n8n"]
      interval: 10s
      timeout: 3s
      retries: 8
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true
    restart: "no"

  n8n:
    profiles: ["homologation"]
    image: ${N8N_IMAGE:?PIN_REVIEWED_N8N_IMAGE_DIGEST}
    init: true
    depends_on:
      n8n-db:
        condition: service_healthy
    # Strictly zero host-published ports while both networks are internal.
    # Private operator ingress (TLS/MFA) remains a separate future gate.
    expose:
      - "5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n_runtime
      DB_POSTGRESDB_PASSWORD_FILE: /run/secrets/n8n_pg_password
      N8N_ENCRYPTION_KEY_FILE: /run/secrets/n8n_encryption_key
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      # No model/network/tool nodes for the NO_AI stage. Reopening any node
      # requires a reviewed transport contract, service identity and egress gate.
      NODES_EXCLUDE: '["n8n-nodes-base.code","n8n-nodes-base.executeCommand","n8n-nodes-base.ssh","n8n-nodes-base.readWriteFile","n8n-nodes-base.httpRequest"]'
      N8N_SSRF_PROTECTION_ENABLED: "true"
      N8N_PUBLIC_API_DISABLED: "true"
      N8N_PUBLIC_API_SWAGGERUI_DISABLED: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
      N8N_COMMUNITY_PACKAGES_ENABLED: "false"
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: "none"
    secrets:
      - n8n_pg_password
      - n8n_encryption_key
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:5678/healthz/readiness',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - n8n_storage
      - n8n_apps_private
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    mem_limit: 1g
    cpus: 2.0
    restart: "no"

volumes:
  n8n_pgdata: {}
  n8n_data: {}
networks:
  n8n_storage:
    internal: true
  n8n_apps_private:
    internal: true

secrets:
  n8n_pg_admin_password:
    file: ${N8N_PG_ADMIN_PASSWORD_FILE:?APPROVED_BOOTSTRAP_SECRET_FILE_REQUIRED}
  n8n_pg_password:
    file: ${N8N_PG_PASSWORD_FILE:?APPROVED_RUNTIME_SECRET_FILE_REQUIRED}
  n8n_encryption_key:
    file: ${N8N_ENCRYPTION_KEY_FILE:?APPROVED_ENCRYPTION_SECRET_FILE_REQUIRED}
